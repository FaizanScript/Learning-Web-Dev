<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Student Form</h1>
    <hr>
    <form method="post">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="enter your name" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="enter your email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" pattern="[0-9]{10}" placeholder="enter your password" required>
        </div>
        <div>
            <label for="phoneno">Phone number:</label>
            <input type="tel" id="phoneno" name="phone no" placeholder="enter your phone no" required>
        </div>
        <div>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">female</label>
            <input type="radio" name="gender" id="other" value="other">
            <label for="other">other</label>
        </div>
        <div>
            <label for="dob">date of birth:</label>
            <input type="date" id="dob" name="date of birth" required>
        </div>
        <div>
            <label for="course">course:</label>
            <select name="course" id="course" required>
                <option value="BTech">BTech</option>
                <option value="BCA">BCA</option>
                <option value="MTech">MTech</option>
                <option value="MCA">MCA</option>
            </select>
        </div>
        <div>
            <input type="checkbox" id="skill1" name="skills" value="HTML">
            <label for="skill1">HTML</label>
        </div>
        <div>
            <input type="checkbox" id="skill2" name="skills" value="CSS">
            <label for="skill2">CSS</label>
        </div>
        <div>
            <input type="checkbox" name="skills" id="skill3" value="javascript">
            <label for="skill3">javascript</label>
        </div>
        <div>
            <input type="checkbox" name="skills" id="skill4" value="java">
            <label for="skill4">java</label>
        </div>
        <div>
            <label for="photo">upload your photo:</label>
            <input type="file" name="photo" id="photo" required>
        </div>
        <div>
            <label for="address">address:</label>
            <textarea name="address" id="address" rows="4" cols="30" placeholder="enter your address"></textarea>
        <div>
            <label for="submit">submit the form:</label>
            <input type="submit" name="submit" id="submit">
        </div>
        <div>
            <label for="reset">reset the form:</label>
            <input type="reset" name="reset" id="reset">
        </div>
    </form>
</body>
</html>
