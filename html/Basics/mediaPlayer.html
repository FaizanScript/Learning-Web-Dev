<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
</head>
<body>
    <h1>Videos and Audios</h1>
    <hr>
    <h2>some videos</h2>
    <div>
        <video src="1.mp4" controls muted loop autoplay></video>
        <video src="2.mp4" controls muted loop autoplay></video>
        <video src="3.mp4" controls muted loop autoplay></video>
        <video src="4.mp4" controls muted loop autoplay></video>
        <video src="5.mp4" controls muted loop autoplay></video>
        <video src="6.mp4" controls muted loop autoplay></video>
    </div>
    <hr>
    <h2>some audios</h2>
    <div>
        <audio src="1.mp3" controls autoplay loop muted preload="auto"></audio>
        <audio src="2.mp3" controls autoplay loop muted preload="auto"></audio>
        <audio src="3.mp3" controls autoplay loop muted preload="auto"></audio>
        <audio src="4.mp3" controls autoplay loop muted preload="auto"></audio>
        <audio src="5.mp3" controls autoplay loop muted preload="auto"></audio>
        <audio src="6.mp3" controls autoplay loop muted preload="auto"></audio>
    </div>

</body>
</html>
