<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="1">
  <!-- Caption -->
  <caption>Pirates Information</caption>

  <!-- Table Header -->
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Position</th>
      <th>Salary</th>
    </tr>
  </thead>

  <!-- Table Body -->
  <tbody>
    <tr>
      <td>1</td>
      <td>luffy</td>
      <td>pirate</td>
      <td>$100,000</td>
    </tr>
    <tr>
      <td>2</td>
      <td>zoro</td>
      <td>swordsman</td>
      <td>$80,000</td>
    </tr>
    <tr>
      <td>3</td>
      <td>nami</td>
      <td>theif</td>
      <td>$200,000</td>
    </tr>
  </tbody>

  <!-- Table Footer -->
  <tfoot>
    <tr>
      <td colspan="3">Total pirates</td>
      <td>3</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
