<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A multiple-choice quiz with score and timing summary.">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="quiz">

        <header class="quiz-header">
            <h1>Quiz App</h1>
        </header>

        <section class="quiz-screen" aria-labelledby="question-text">

            <form class="question-form" id="question-form">

                <div class="question-meta">

                    <p class="question-count" aria-live="polite">
                        Question <span data-current>6</span> of <span data-total>10</span>
                    </p>

                    <progress class="progress-bar" max="10" value="0" aria-label="Quiz progress">6 of 10</progress>

                </div>

                <fieldset class="options">

                    <legend class="question" id="question-text">
                        The Question
                    </legend>

                    <div class="option">
                        <input type="radio" id="option-a" name="answer" value="a" required>
                        <label for="option-a">
                            <span class="option-key" aria-hidden="true">A</span>
                            <span class="option-text">option A</span>
                        </label>
                    </div>

                    <div class="option">
                        <input type="radio" id="option-b" name="answer" value="b" required>
                        <label for="option-b">
                            <span class="option-key" aria-hidden="true">B</span>
                            <span class="option-text">option B</span>
                        </label>
                    </div>

                    <div class="option">
                        <input type="radio" id="option-c" name="answer" value="c" required>
                        <label for="option-c">
                            <span class="option-key" aria-hidden="true">C</span>
                            <span class="option-text">option C</span>
                        </label>
                    </div>

                    <div class="option">
                        <input type="radio" id="option-d" name="answer" value="d" required>
                        <label for="option-d">
                            <span class="option-key" aria-hidden="true">D</span>
                            <span class="option-text">option D</span>
                        </label>
                    </div>

                    <div class="answer-options">

                    </div>

                </fieldset>

                <button type="submit" class="btn-primary">Submit</button>

            </form>

        </section>

        <section class="result-screen" aria-labelledby="result-title" tabindex="-1" hidden>

            <h2 class="result-title" id="result-title">Solid performace</h2>

            <div class="score-ring" style="--score: 0" role="img" aria-label="Score: 0 percent, 0 of 10 correct">
                <p class="score-percent"><span data-percent>0</span>%</p>
                <p class="score-fraction"><span data-correct-count>0</span>/<span data-total-count>10</span></p>
            </div>

            <dl class="stats">
                <div class="stat">
                    <dt>Correct</dt>
                    <dd data-stat="correct">5</dd>
                </div>
                <div class="stat">
                    <dt>Missed</dt>
                    <dd data-stat="missed">1</dd>
                </div>
                <div class="stat">
                    <dt>Time</dt>
                    <!-- <time datetime="PT29S"> = machine-readable duration (29 seconds) -->
                    <dd><time data-stat="time" datetime="PT29S">00:00</time></dd>
                </div>
                <div class="stat">
                    <dt>Avg</dt>
                    <dd><time data-stat="avg" datetime="PT5S">00:00</time></dd>
                </div>
            </dl>

        </section>

    </main>

</body>

</html>
