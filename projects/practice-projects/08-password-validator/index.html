<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="card">

            <div class="input">
                <label for="password">Password</label>
                <input type="password" id="password">
            </div>

            <div class="requirements">
                <h3>Password Requirements:</h3>
                <p> <span class="characters"></span> At least 8 Characters </p>
                <p> <span class="number"></span> Contains a number </p>
                <p> <span class="uppercase"></span> Contains an uppercase letter </p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
