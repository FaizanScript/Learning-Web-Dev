<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">

            <button type="button" id="themeToggle" aria-label="Switch to dark mode" title="Switch to dark mode">
                🌙
            </button>

            <h1>To-Do List</h1>
            <p>Stay organized. Get Things done.</p>

        </header>

        <!-- progress -->
        <section class="progress-section">

            <div class="progress-header">
                <span>Today's Progress</span>
                <span id="progress-bar">0%</span>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <p id="progressCount">0 of 0 tasks completed</p>
        </section>

        <!-- statistics -->
        <section class="stats">

            <div class="stat-card">
                <span>Total</span>
                <strong id="totaltask">0</strong>
            </div>

            <div class="stat-card">
                <span>Active</span>
                <strong id="activetask">0</strong>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <strong id="completedtask">0</strong>
            </div>

            <div class="stat-card">
                <span>Overdue</span>
                <strong id="overduetask">0</strong>
            </div>

        </section>

        <!-- main content -->
        <section class="todo-container">

            <!-- add task -->
            <div class="task-form">

                <h2>Add New Task</h2>

                <form id="todoform">

                    <label for="tasktitle">Task Title</label>
                    <input type="text" id="tasktitle" placeholder="Task title" maxlength="100" required autofocus>

                    <div class="textarea-wrapper">

                        <label for="taskdescription">Description</label>
                        <textarea id="taskdescription" placeholder="Description (optional)" maxlength="300"></textarea>

                        <span id="descriptionCounter">
                            0 / 300
                        </span>
                    </div>

                    <label for="taskpriority">Priority</label>
                    <select name="" id="taskpriority">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>

                    <label for="taskduedate">Due Date</label>
                    <input type="date" id="taskduedate">

                    <div class="form-actions">

                        <button type="submit" id="submitTaskBtn">
                            + Add Task
                        </button>

                        <button type="button" id="cancelEditBtn" class="cancel-btn" hidden>
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

            <!-- tasks -->

            <div class="tasks-section">

                <div class="tasks-header">

                    <div>
                        <h2>Your Tasks</h2>
                        <p id="taskCount">Showing 0 of 0 tasks</p>
                    </div>

                    <label for="sortSelect" class="sr-only">Sort tasks</label>
                    <select id="sortSelect">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                        <option value="priority">Priority</option>
                        <option value="dueDate">Due Date</option>
                        <option value="alphabetical">A → Z</option>
                    </select>

                    <button type="button" id="clearcompleted">
                        Clear Completed
                    </button>

                </div>

                <!-- search -->
                <label for="searchinput" class="sr-only">Search tasks</label>
                <input type="search" id="searchinput" placeholder="Search Tasks...">

                <!-- filters -->
                <div class="filters">

                    <button type="button" class="filter-btn active" data-filter="all">
                        All
                    </button>

                    <button type="button" class="filter-btn" data-filter="active">
                        Active
                    </button>

                    <button type="button" class="filter-btn" data-filter="completed">
                        Completed
                    </button>

                    <button type="button" class="filter-btn" data-filter="easy">
                        Easy
                    </button>

                    <button type="button" class="filter-btn" data-filter="medium">
                        Medium
                    </button>

                    <button type="button" class="filter-btn" data-filter="hard">
                        Hard
                    </button>

                </div>

                <!-- task list -->
                <div id="tasklist"></div>

            </div>

        </section>

    </main>

    <!-- Delete Confirmation Modal -->

    <div class="modal-overlay" id="deleteModal" id="deleteModal" role="dialog" aria-modal="true"
        aria-labelledby="deleteModalTitle">

        <div class="delete-modal">

            <div class="modal-icon">
                🗑️
            </div>

            <h2 id="deleteModalTitle">Delete Task?</h2>

            <p>
                Are you sure you want to delete this task?
                This action cannot be undone.
            </p>

            <div class="modal-actions">

                <button type="button" id="cancelDeleteBtn">
                    Cancel
                </button>

                <button type="button" id="confirmDeleteBtn" class="delete-confirm-btn">
                    Delete
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
